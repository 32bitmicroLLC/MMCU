# Raspberry Pi Pico 2: the default board for MMCU_TARGET=rp2350.
# Facets described in docs/board.md; this is the default MMCU_BOARD
# declaration for RP2350-family builds.

name: pico2
target: rp2350
platforms: [pico_sdk]

power:
  regulation: DC-DC          # onboard buck-boost switching regulator (not LDO)
  input_voltage_min: 1.8     # VSYS, volts
  input_voltage_max: 5.5
rails: [3.3]                 # volts, what the board actually supplies

analog_io:
  adc_channels_broken_out: 3   # ADC0-ADC2 on GP26-GP28 (ADC3 is internal, VSYS/3)

digital_io:
  gpio_broken_out: 26          # GP0-GP22 and GP26-GP28 on the edge pins

buses: []                    # no onboard transceivers/radios

connectors:
  - USB-MICRO-B
  - HEADER-0.1IN-20PIN-DUAL-CASTELLATED
  - SWD-3PIN-CASTELLATED

links:
  documentation:
    - label: Raspberry Pi Pico-series documentation
      url: https://www.raspberrypi.com/documentation/microcontrollers/pico-series.html
    - label: Raspberry Pi Pico 2 product page
      url: https://www.raspberrypi.com/products/raspberry-pi-pico-2/
  support_repositories:
    - label: raspberrypi/pico-sdk
      url: https://github.com/raspberrypi/pico-sdk
    - label: raspberrypi/pico-examples
      url: https://github.com/raspberrypi/pico-examples
