# Raspberry Pi Pico W: a board variant of MMCU_TARGET=rp2040 (same chip,
# same MMCU_TARGET), adding the CYW43439 wireless chip -- the worked
# example in docs/board.md for how MMCU_BOARD varies independently of
# MMCU_TARGET rather than needing a new target.

name: pico-w
target: rp2040
platforms: [pico_sdk]

power:
  regulation: DC-DC          # onboard buck-boost switching regulator (not LDO)
  input_voltage_min: 1.8     # VSYS, volts
  input_voltage_max: 5.5
rails: [3.3]                 # volts, what the board actually supplies

analog_io:
  adc_channels_broken_out: 3   # ADC0-ADC2 on GP26-GP28; VSYS monitor is shared

digital_io:
  gpio_broken_out: 26          # GP0-GP22 and GP26-GP28 on the edge pins
  internal_pins:
    - GP23                     # CYW43439 power control
    - GP24                     # CYW43439 data/IRQ sharing
    - GP25                     # CYW43439 chip select; LED is on CYW43439 GPIO
    - GP29                     # VSYS monitor, shared with wireless SPI clock

buses: [WIFI, BLUETOOTH]

connectors:
  - USB-MICRO-B
  - HEADER-0.1IN-20PIN-DUAL-CASTELLATED
  - SWD-3PIN-CASTELLATED-CENTRAL

default_providers:
  wifi: cyw43439
  bluetooth: cyw43439

links:
  documentation:
    - label: Raspberry Pi Pico-series documentation
      url: https://www.raspberrypi.com/documentation/microcontrollers/pico-series.html
    - label: Raspberry Pi Pico product page
      url: https://www.raspberrypi.com/products/raspberry-pi-pico/
  support_repositories:
    - label: raspberrypi/pico-sdk
      url: https://github.com/raspberrypi/pico-sdk
    - label: raspberrypi/pico-examples
      url: https://github.com/raspberrypi/pico-examples
