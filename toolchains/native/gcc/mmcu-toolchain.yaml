schema: mmcu.toolchain/v1
name: gcc-native
kind: toolchain
family: gcc
description: Native host GCC toolchain for MMCU C++20 module builds.
provides:
  - C
  - CXX
  - CXX20
  - CXX20_MODULES
  - CMAKE_CXX_MODULE_SCAN
version:
  minimum: "15.0.0"
commands:
  cc:
    patterns:
      - gcc-{version}
      - gcc
  cxx:
    patterns:
      - g++-{version}
      - g++
targets:
  host:
    supported: true
platforms:
  compatible:
    - native
