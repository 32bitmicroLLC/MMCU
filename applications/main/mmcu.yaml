# Manifest for the mmcu_app application (see docs/application.md,
# docs/dependency-dsl.md). CMake reads this at configure time through
# tools/mmcu-deps.py and records the concrete result in the build directory.

name: mmcu_app
kind: application

# applications/main/main.cpp only imports the stable, target/platform-
# resolved modules (cpu, gpio, uart -- see docs/target-modules.md) and
# nothing from libraries/, drivers/, or modules/, which don't have any
# packages in them yet (see docs/libraries.md, docs/drivers.md,
# docs/modules.md: those trees are created on demand). There is nothing
# for this application to depend on today.
depends: []
