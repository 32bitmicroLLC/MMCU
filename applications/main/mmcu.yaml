# Manifest for the mmcu_app application (see docs/application.md,
# docs/dependency-dsl.md). CMake reads this at configure time through
# tools/mmcu-deps.py and records the concrete result in the build directory.

name: mmcu_app
kind: application

# applications/main/main.cpp directly imports the built-in core modules
# (cpu, gpio, uart -- see docs/target-modules.md). Those core specs live in
# modules/core/ and are currently added by CMake's core module list rather
# than through this application dependency list. There is nothing from
# libraries/, drivers/, or optional generic modules for this application to
# depend on today.
depends: []
