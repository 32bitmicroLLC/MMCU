schema: mmcu.module/v1
name: platform-pico-sdk
kind: platform
description: Raspberry Pi pico-sdk platform family for MMCU RP2040/RP2350 builds.
metadata:
  links:
    documentation:
      - label: Raspberry Pi Pico SDK documentation
        url: https://www.raspberrypi.com/documentation/pico-sdk/
      - label: Raspberry Pi Pico-series documentation
        url: https://www.raspberrypi.com/documentation/microcontrollers/pico-series.html
    support_repositories:
      - label: raspberrypi pico-sdk
        url: https://github.com/raspberrypi/pico-sdk
      - label: raspberrypi pico-examples
        url: https://github.com/raspberrypi/pico-examples
provides:
  - pico-sdk-platform
  - platform-pico-sdk
toolchains:
  requires:
    - C
    - CXX
    - ASM
    - FREESTANDING_C
    - FREESTANDING_CXX
    - ARM_EABI
    - CXX20_MODULES
    - PICO_SDK_SUPPORTED
  compatible:
    - arm-none-eabi-gcc
  incompatible:
    - name: clang-arm-none-eabi
      reason: pico-sdk Clang support requires a configured ARM runtime/sysroot and is not wired yet
depends:
  - name: platform-pico-sdk-2
    version: 2.0.0
