schema: mmcu.module/v1
name: platform-cmsis
kind: platform
description: Arm CMSIS platform family for MMCU bare-metal builds.
metadata:
  links:
    documentation:
      - label: CMSIS 6 Introduction
        url: https://arm-software.github.io/CMSIS_6/latest/General/index.html
    support_repositories:
      - label: ARM-software CMSIS_6
        url: https://github.com/ARM-software/CMSIS_6
provides:
  - cmsis-platform
  - platform-cmsis
toolchains:
  requires:
    - C
    - CXX
    - ASM
    - FREESTANDING_C
    - FREESTANDING_CXX
    - ARM_EABI
    - CXX20_MODULES
  compatible:
    - arm-none-eabi-gcc
    - clang-arm-none-eabi
depends:
  - name: platform-cmsis-6
    version: 6.0.0
